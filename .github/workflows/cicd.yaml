name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

permissions:
  contents: read

env:
  AFP: afp-2026-07-21
  GHC: "9.10.3"
  CABAL: "3.16"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT: 1.7.12
      HLINT: "3.10"
    steps:
      - uses: actions/checkout@v7

      - name: Install linters
        run: |
          bin="$HOME/.local/bin"
          mkdir -p "$bin" "$HOME/.local/hlint"
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT/actionlint_${ACTIONLINT}_linux_amd64.tar.gz" \
            | tar -xz -C "$bin" actionlint
          curl -sSfL "https://github.com/ndmitchell/hlint/releases/download/v$HLINT/hlint-$HLINT-x86_64-linux.tar.gz" \
            | tar -xz -C "$HOME/.local/hlint" --strip-components=1
          { echo "$bin"; echo "$HOME/.local/hlint"; } >> "$GITHUB_PATH"

      - name: Run checks
        run: .githooks/pre-commit

  isabelle:
    name: Isabelle
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Setup toolchain
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git > /dev/null

          echo /home/isabelle/Isabelle/bin >> "$GITHUB_PATH"

      - uses: actions/checkout@v7
        with:
          submodules: true

      - id: afp
        uses: actions/cache@v6
        with:
          path: afp
          key: ${{env.AFP}}

      - name: Download AFP
        if: steps.afp.outputs.cache-hit != 'true'
        run: |
          mkdir afp
          curl -sSfL "https://www.isa-afp.org/release/$AFP.tar.gz" \
            | tar -xz -C afp --strip-components=1 "$AFP/thys"

      - name: Get Isabelle user
        id: user
        run: echo "home=$(isabelle getenv -b ISABELLE_HOME_USER)" >> "$GITHUB_OUTPUT"

      - id: heaps
        uses: actions/cache/restore@v6
        with:
          path: ${{steps.user.outputs.home}}/heaps
          key: heaps-${{env.AFP}}-${{hashFiles('**/ROOT', '**/ROOTS', '**/*.thy', '**/*.ML', 'isabelle-site/**', '!afp/**')}}
          restore-keys: heaps-${{env.AFP}}-

      - name: Register isabelle-site
        run: |
          isabelle components -u "$PWD/isabelle-site"
          isabelle scala_build

      - name: Build sessions
        run: |
          isabelle build -b -e -v -j 2 -d . -d afp/thys \
            CaraML_Export CaraML_Web CaraML_Spec \
            CaraML_Prelude_Test CaraML_Parser_Test

      - if: ${{!cancelled() && steps.heaps.outputs.cache-hit != 'true'}}
        uses: actions/cache/save@v6
        with:
          path: ${{steps.user.outputs.home}}/heaps
          key: ${{steps.heaps.outputs.cache-primary-key}}

      - name: Generate site
        run: isabelle site -n -c -d . -d afp/thys -O dist/site CaraML_Web

      - uses: actions/upload-artifact@v7
        with:
          name: verified
          path: haskell/verified
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: dist/site

  sdist:
    name: Source distribution
    needs: isabelle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: verified
          path: haskell/verified

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{env.GHC}}
          cabal-version: ${{env.CABAL}}

      - name: Package sources
        working-directory: haskell
        run: cabal sdist -o ../dist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  haskell:
    name: Build compiler (${{matrix.target}})
    needs: sdist
    runs-on: ${{matrix.runner}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64,    runner: ubuntu-24.04 }
          - { target: linux-arm64,  runner: ubuntu-24.04-arm }
          - { target: darwin-arm64, runner: macos-15 }
          - { target: win32-x64,    runner: windows-2025 }
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: haskell/cabal.project
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: sdist

      - name: Unpack sources
        id: unpack
        run: |
          echo "binary=caraml-${{matrix.target}}.tar.gz" >> "$GITHUB_OUTPUT"
          mkdir pkg
          tar -xzf caraml-*.tar.gz -C pkg --strip-components=1
          cp haskell/cabal.project pkg/

      - id: hs
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{env.GHC}}
          cabal-version: ${{env.CABAL}}

      - name: Cabal dry-run
        working-directory: pkg
        run: |
          cabal update
          cabal build all --dry-run

      - id: store
        uses: actions/cache/restore@v6
        with:
          path: ${{steps.hs.outputs.cabal-store}}
          key: cabal-${{matrix.target}}-${{env.GHC}}-${{hashFiles('pkg/dist-newstyle/cache/plan.json')}}
          restore-keys: cabal-${{matrix.target}}-${{env.GHC}}-

      - name: Cabal build dependencies
        working-directory: pkg
        run: cabal build all --only-dependencies

      - if: steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{steps.hs.outputs.cabal-store}}
          key: ${{steps.store.outputs.cache-primary-key}}

      - name: Cabal build and package CaraML
        working-directory: pkg
        run: |
          cabal build all
          mkdir -p ../out
          cabal install exe:caraml --installdir=../out --install-method=copy --overwrite-policy=always
          cp LICENSE ../out/
          tar -czf "../${{steps.unpack.outputs.binary}}" -C ../out .

      - uses: actions/upload-artifact@v7
        with:
          name: caraml-${{matrix.target}}
          path: ${{steps.unpack.outputs.binary}}
          if-no-files-found: error

  editors:
    name: Editor plugins
    needs: lint
    runs-on: ubuntu-24.04
    outputs:
      vscode: ${{steps.versions.outputs.vscode}}
      vscode_new: ${{steps.versions.outputs.vscode_new}}
      emacs: ${{steps.versions.outputs.emacs}}
      emacs_new: ${{steps.versions.outputs.emacs_new}}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Package .vsix
        working-directory: editors/vscode
        env:
          VSCE: 4.0.0
        run: |
          npm ci
          npx --yes "@vscode/vsce@$VSCE" package -o ../../caraml.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: caraml.vsix
          if-no-files-found: error

      - name: Check editor versions
        id: versions
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          new() { git ls-remote --exit-code --tags origin "refs/tags/$1" > /dev/null && echo false || echo true; }
          v=$(jq -r .version editors/vscode/package.json)
          e=$(sed -n 's/^;; Version: *//p' editors/emacs/local/caraml-mode/caraml-mode.el)
          {
            echo "vscode=$v";  echo "vscode_new=$(new "vscode-v$v")"
            echo "emacs=$e";   echo "emacs_new=$(new "emacs-v$e")"
          } >> "$GITHUB_OUTPUT"

  publish-editors:
    name: Publish editor plugins
    needs: editors
    if: needs.editors.outputs.vscode_new == 'true' || needs.editors.outputs.emacs_new == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      VSCE: 4.0.0
      OVSX: 1.2.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: needs.editors.outputs.vscode_new == 'true'
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        if: needs.editors.outputs.vscode_new == 'true'
        with:
          name: vsix

      - uses: azure/login@v3
        if: needs.editors.outputs.vscode_new == 'true'
        with:
          client-id: ${{vars.AZURE_CLIENT_ID}}
          tenant-id: ${{vars.AZURE_TENANT_ID}}
          allow-no-subscriptions: true

      - name: Publish .vsix
        if: needs.editors.outputs.vscode_new == 'true'
        env:
          VERSION: vscode-v${{needs.editors.outputs.vscode}}
        run: |
          npx --yes "@vscode/vsce@$VSCE" publish --azure-credential --packagePath caraml.vsix --skip-duplicate
          npx --yes "ovsx@$OVSX" publish caraml.vsix --trusted-publishing --skip-duplicate

          git tag "$VERSION" && git push origin "$VERSION"

      - name: Tag emacs
        if: needs.editors.outputs.emacs_new == 'true'
        env:
          VERSION: emacs-v${{needs.editors.outputs.emacs}}
        run: |
          git tag "$VERSION" && git push origin "$VERSION"

  release:
    name: Release compiler
    needs: [sdist, haskell]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check release version
        id: version
        run: |
          new() { git ls-remote --exit-code --tags origin "refs/tags/$1" > /dev/null && echo false || echo true; }
          v=$(sed -n 's/^version: *//p' haskell/caraml.cabal)
          { echo "version=$v"; echo "tag=v$v"; echo "new=$(new "v$v")"; } >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.new == 'true'
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: "{sdist,caraml-*}"

      - name: Name the source asset
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{steps.version.outputs.version}}
        run: mv dist/caraml-{"$VERSION",src}.tar.gz

      - name: Create release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{github.token}}
        run: gh release create "${{steps.version.outputs.tag}}" dist/* --target "$GITHUB_SHA" --generate-notes

  pages:
    name: GitHub Pages
    needs: isabelle
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{steps.deploy.outputs.page_url}}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
